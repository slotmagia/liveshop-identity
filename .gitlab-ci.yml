workflow:
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - when: never

stages:
  - build
  - deploy

default:
  tags:
    - liveshop-test
  retry:
    max: 1
    when:
      - runner_system_failure
      - stuck_or_timeout_failure

variables:
  GIT_DEPTH: "20"
  DOCKER_BUILDKIT: "1"
  PLATFORM_REGISTRY_URL: "http://127.0.0.1:18082/internal/v1/module-registry"
  MODULE_NAME: "liveshop-identity"
  MODULE_ID: "identity"
  DEPENDENCY_REPOSITORIES: "kernel-go liveshop-platform"
  BACKEND_PORT: "18092"
  READINESS_URL: "http://127.0.0.1:18092/readyz"
  READINESS_MODE: "success"
  REGISTER_MODULE: "true"
  BACKEND_ORIGIN: "http://identity:18092"
  GRPC_ENDPOINT: "dns:///identity:19092"
  ARTIFACT_URLS: '{"admin":"http://192.168.5.140:15201","merch":"http://192.168.5.140:15202","shop":"http://192.168.5.140:15203/identity-shop.js","live":"http://192.168.5.140:15204/identity-live.js"}'

build_images:
  stage: build
  interruptible: true
  script:
    - bash ci/build.sh

deploy_test:
  stage: deploy
  needs:
    - build_images
  interruptible: false
  resource_group: test-5-140
  environment:
    name: test/5-140
    url: http://192.168.5.140
  script:
    - bash ci/prepare-contexts.sh
    - bash ci/deploy.sh
