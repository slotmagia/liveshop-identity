syntax = "proto3";

package liveshop.identity.v1;

option go_package = "github.com/lvtuopen-ai/liveshop-identity/protocol/gen/go/identity/v1;identityv1";

// IdentityDirectory is the synchronous, read-only boundary used by Platform,
// Gateway and business modules. Identity facts can only be changed through
// Identity commands; consumers must not turn these responses into a writable
// copy of the directory.
service IdentityDirectoryService {
  rpc ResolvePrincipalContext(ResolvePrincipalContextRequest) returns (ResolvePrincipalContextResponse);
  rpc ResolveShopContext(ResolveShopContextRequest) returns (ResolveShopContextResponse);
  rpc ValidateSelectedContext(ValidateSelectedContextRequest) returns (ValidateSelectedContextResponse);
  rpc GetOrganizationSubtree(GetOrganizationSubtreeRequest) returns (GetOrganizationSubtreeResponse);
  rpc BatchGetSubjects(BatchGetSubjectsRequest) returns (BatchGetSubjectsResponse);
  rpc ResolveLegacySubjects(ResolveLegacySubjectsRequest) returns (ResolveLegacySubjectsResponse);
}

message ResolvePrincipalContextRequest {
  string subject = 1;
  SelectedContext selected_context = 2;
  string session_id = 3;
  int64 expected_context_version = 4;
}

message ResolvePrincipalContextResponse {
  Subject subject = 1;
  WorkforceMember member = 2;
  Organization organization = 3;
  repeated int64 organization_unit_ids = 4;
  repeated ShopContext available_shops = 5;
  SelectedContext selected_context = 6;
  int64 identity_version = 7;
  int64 organization_version = 8;
  int64 access_version = 9;
}

message ResolveShopContextRequest {
  oneof selector {
    int64 shop_id = 1;
    string code = 3;
    string subdomain = 4;
  }
  reserved 2;
  reserved "commercial_key";
}

message ResolveShopContextResponse {
  ShopContext context = 1;
  string code = 2;
  string subdomain = 3;
  string name = 4;
  string status = 5;
  int64 version = 6;
  // currency is the shop's authoritative ISO 4217 settlement currency.
  // It is deliberately outside ShopContext because currency is not part of
  // the verified merchant/shop identity tuple.
  string currency = 7;
}

message ValidateSelectedContextRequest {
  string subject = 1;
  SelectedContext selected_context = 2;
  int64 expected_identity_version = 3;
  int64 expected_access_version = 4;
}

message ValidateSelectedContextResponse {
  bool valid = 1;
  string denial_reason = 2;
  SelectedContext selected_context = 3;
  int64 identity_version = 4;
  int64 organization_version = 5;
  int64 access_version = 6;
}

message GetOrganizationSubtreeRequest {
  int64 organization_id = 1;
  int64 root_unit_id = 2;
}

message GetOrganizationSubtreeResponse {
  int64 organization_id = 1;
  repeated int64 organization_unit_ids = 2;
  int64 organization_version = 3;
}

message BatchGetSubjectsRequest {
  repeated string subjects = 1;
}

message BatchGetSubjectsResponse {
  repeated Subject subjects = 1;
}

message ResolveLegacySubjectsRequest {
  string realm = 1;
  repeated int64 legacy_uids = 2;
}

message ResolveLegacySubjectsResponse {
  repeated Subject subjects = 1;
}

message Subject {
  string subject = 1;
  string realm = 2;
  string principal_type = 3;
  string display_name = 4;
  string status = 5;
  int64 version = 6;
  int64 legacy_uid = 7;
}

message WorkforceMember {
  int64 member_id = 1;
  int64 organization_id = 2;
  int64 merchant_id = 3;
  string member_type = 4;
  string status = 5;
  int64 access_version = 6;
  int64 legacy_staff_id = 7;
}

message Organization {
  int64 organization_id = 1;
  string organization_type = 2;
  int64 merchant_id = 3;
  string name = 4;
  string status = 5;
  int64 version = 6;
}

message ShopContext {
  reserved 1, 3;
  reserved "app_id", "commercial_id";
  int64 merchant_id = 2;
  int64 shop_id = 4;
}

message SelectedContext {
  reserved 3, 4;
  reserved "app_id", "commercial_id";
  int64 organization_id = 1;
  int64 merchant_id = 2;
  int64 shop_id = 5;
}
